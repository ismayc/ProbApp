name: Deploy to shinyapps.io

# Deploys the app to https://ismay.shinyapps.io/ProbApp on every push to the
# default branch, and can be run on demand from the Actions tab.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): SHINYAPPS_TOKEN and SHINYAPPS_SECRET, both from your shinyapps.io
# account (Account -> Tokens -> Show).

on:
  push:
    branches: [master, main]
    # Skip redeploys for docs-only changes (README/NEWS/etc.). A commit that
    # also touches non-.md files still deploys. workflow_dispatch is unaffected.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: shinyapps-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Match the renv.lock R version (newer R fails to compile some pinned
          # packages, e.g. S7 0.2.1 on R 4.6).
          r-version: '4.5.3'
          use-public-rspm: true

      # Restore the pinned package versions (renv.lock), then add rsconnect.
      - uses: r-lib/actions/setup-renv@v2

      - name: Install rsconnect
        run: Rscript -e 'if (!requireNamespace("rsconnect", quietly = TRUE)) install.packages("rsconnect")'

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = "ismay",
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            # Deploy only the runtime app files (no tests, CI, renv, .Rprofile).
            rsconnect::deployApp(
              appName     = "ProbApp",
              appFiles    = c("global.R", "ui.R", "server.R", "functions.R", "formulas.R"),
              forceUpdate = TRUE
            )
          '
